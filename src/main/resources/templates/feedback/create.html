<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Provide Feedback - Online Exam System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .star-rating {
            font-size: 2rem;
            color: #ddd;
            cursor: pointer;
        }
        .star-rating.active {
            color: #ffc107;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/dashboard">
                <i class="fas fa-graduation-cap"></i> Online Exam System
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/dashboard">Dashboard</a>
                <a class="nav-link" href="/auth/logout">Logout</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card mb-4">
                    <div class="card-header" th:classappend="${result.isPassed} ? 'bg-success text-white' : 'bg-danger text-white'">
                        <h5><i class="fas fa-chart-line"></i> Exam Result Summary</h5>
                    </div>
                    <div class="card-body">
                        <div class="row text-center">
                            <div class="col-md-3">
                                <h4 th:text="${result.exam.title}">Exam Title</h4>
                                <small class="text-muted">Exam</small>
                            </div>
                            <div class="col-md-3">
                                <h4 th:text="${result.score} + '/' + ${result.exam.totalMarks}">0/0</h4>
                                <small class="text-muted">Score</small>
                            </div>
                            <div class="col-md-3">
                                <h4 th:text="${#numbers.formatDecimal(result.percentage, 1, 1)} + '%'">0%</h4>
                                <small class="text-muted">Percentage</small>
                            </div>
                            <div class="col-md-3">
                                <h4 th:classappend="${result.isPassed} ? 'text-success' : 'text-danger'" 
                                    th:text="${result.isPassed} ? 'PASSED' : 'FAILED'">Status</h4>
                                <small class="text-muted">Result</small>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="card">
                    <div class="card-header">
                        <h5><i class="fas fa-comment-alt"></i> Provide Feedback</h5>
                        <small class="text-muted">Help us improve the exam experience</small>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/feedback/result/{resultId}(resultId=${result.id})}" method="post" th:object="${feedback}">
                            <div class="mb-4">
                                <label class="form-label">Overall Rating *</label>
                                <div class="d-flex align-items-center">
                                    <div id="starRating" class="me-3">
                                        <span class="star-rating" data-rating="1"><i class="fas fa-star"></i></span>
                                        <span class="star-rating" data-rating="2"><i class="fas fa-star"></i></span>
                                        <span class="star-rating" data-rating="3"><i class="fas fa-star"></i></span>
                                        <span class="star-rating" data-rating="4"><i class="fas fa-star"></i></span>
                                        <span class="star-rating" data-rating="5"><i class="fas fa-star"></i></span>
                                    </div>
                                    <span id="ratingText" class="text-muted">Click to rate</span>
                                </div>
                                <input type="hidden" th:field="*{rating}" id="ratingInput" required>
                            </div>

                            <div class="mb-4">
                                <label for="comments" class="form-label">Comments</label>
                                <textarea class="form-control" id="comments" th:field="*{comments}" rows="5" 
                                          placeholder="Share your feedback about the exam experience..."></textarea>
                            </div>

                            <div class="text-center">
                                <button type="submit" class="btn btn-success btn-lg">
                                    <i class="fas fa-paper-plane"></i> Submit Feedback
                                </button>
                                <a th:href="@{/results/{id}(id=${result.id})}" class="btn btn-secondary btn-lg">
                                    <i class="fas fa-arrow-left"></i> Back to Result
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const stars = document.querySelectorAll('.star-rating');
        const ratingInput = document.getElementById('ratingInput');
        const ratingText = document.getElementById('ratingText');
        
        const ratingTexts = {
            1: 'Poor',
            2: 'Fair', 
            3: 'Good',
            4: 'Very Good',
            5: 'Excellent'
        };
        
        stars.forEach(star => {
            star.addEventListener('click', function() {
                const rating = parseInt(this.dataset.rating);
                ratingInput.value = rating;
                ratingText.textContent = ratingTexts[rating];
                
                stars.forEach((s, index) => {
                    if (index < rating) {
                        s.classList.add('active');
                    } else {
                        s.classList.remove('active');
                    }
                });
            });
        });
    </script>
</body>
</html>
