<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management - Online Exam System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/dashboard">
                <i class="fas fa-graduation-cap"></i> Online Exam System
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/dashboard">Dashboard</a>
                <a class="nav-link" href="/auth/logout">Logout</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row">
            <div class="col-12">
                <div class="card">
                    <div class="card-header">
                        <h4><i class="fas fa-users"></i> User Management</h4>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-hover">
                                <thead class="table-dark">
                                    <tr>
                                        <th>ID</th>
                                        <th>Full Name</th>
                                        <th>Username</th>
                                        <th>Email</th>
                                        <th>Role</th>
                                        <th>Status</th>
                                        <th>Created</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="user : ${users}">
                                        <td th:text="${user.id}">1</td>
                                        <td th:text="${user.fullName}">Full Name</td>
                                        <td th:text="${user.username}">username</td>
                                        <td th:text="${user.email}">email@example.com</td>
                                        <td>
                                            <form th:action="@{/admin/users/{id}/role(id=${user.id})}" method="post" style="display: inline;">
                                                <select name="roleId" class="form-select form-select-sm" onchange="this.form.submit()">
                                                    <option th:each="role : ${roles}" 
                                                            th:value="${role.id}" 
                                                            th:text="${role.name}"
                                                            th:selected="${role.id == user.role.id}">Role</option>
                                                </select>
                                            </form>
                                        </td>
                                        <td>
                                            <span class="badge" th:classappend="${user.isActive} ? 'bg-success' : 'bg-danger'"
                                                  th:text="${user.isActive} ? 'Active' : 'Inactive'">Status</span>
                                        </td>
                                        <td th:text="${#temporals.format(user.createdAt, 'dd/MM/yyyy')}">Date</td>
                                        <td>
                                            <form th:action="@{/admin/users/{id}/toggle(id=${user.id})}" method="post" style="display: inline;">
                                                <button type="submit" class="btn btn-sm" 
                                                        th:classappend="${user.isActive} ? 'btn-outline-danger' : 'btn-outline-success'"
                                                        th:text="${user.isActive} ? 'Deactivate' : 'Activate'">Toggle</button>
                                            </form>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
