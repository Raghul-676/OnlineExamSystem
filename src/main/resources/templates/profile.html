<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - Online Exam System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/dashboard">
                <i class="fas fa-graduation-cap"></i> Online Exam System
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/dashboard">Dashboard</a>
                <a class="nav-link" href="/auth/logout">Logout</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header">
                        <h4><i class="fas fa-user-circle"></i> User Profile</h4>
                    </div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-4 text-center">
                                <i class="fas fa-user-circle fa-5x text-primary mb-3"></i>
                                <h5 th:text="${user.fullName}">Full Name</h5>
                                <p class="text-muted" th:text="${user.role.name}">Role</p>
                            </div>
                            <div class="col-md-8">
                                <table class="table table-borderless">
                                    <tr>
                                        <th width="30%">Username:</th>
                                        <td th:text="${user.username}">username</td>
                                    </tr>
                                    <tr>
                                        <th>Email:</th>
                                        <td th:text="${user.email}">email@example.com</td>
                                    </tr>
                                    <tr>
                                        <th>Full Name:</th>
                                        <td th:text="${user.fullName}">Full Name</td>
                                    </tr>
                                    <tr>
                                        <th>Role:</th>
                                        <td>
                                            <span class="badge bg-primary" th:text="${user.role.name}">Role</span>
                                        </td>
                                    </tr>
                                    <tr>
                                        <th>Member Since:</th>
                                        <td th:text="${#temporals.format(user.createdAt, 'dd/MM/yyyy')}">Date</td>
                                    </tr>
                                    <tr>
                                        <th>Status:</th>
                                        <td>
                                            <span class="badge" th:classappend="${user.isActive} ? 'bg-success' : 'bg-danger'"
                                                  th:text="${user.isActive} ? 'Active' : 'Inactive'">Status</span>
                                        </td>
                                    </tr>
                                </table>
                            </div>
                        </div>
                        
                        <div class="text-center mt-4">
                            <a href="/dashboard" class="btn btn-primary">
                                <i class="fas fa-arrow-left"></i> Back to Dashboard
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
