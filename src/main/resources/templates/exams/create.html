<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Exam - Online Exam System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/dashboard">
                <i class="fas fa-graduation-cap"></i> Online Exam System
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/dashboard">Dashboard</a>
                <a class="nav-link" href="/auth/logout">Logout</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row">
            <div class="col-12">
                <div class="card">
                    <div class="card-header">
                        <h4><i class="fas fa-plus-circle"></i> Create New Exam</h4>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/exams/create}" method="post" th:object="${exam}">
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="title" class="form-label">Exam Title *</label>
                                    <input type="text" class="form-control" id="title" th:field="*{title}" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="durationMinutes" class="form-label">Duration (Minutes) *</label>
                                    <input type="number" class="form-control" id="durationMinutes" th:field="*{durationMinutes}" min="1" required>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="description" class="form-label">Description</label>
                                <textarea class="form-control" id="description" th:field="*{description}" rows="3"></textarea>
                            </div>

                            <div class="row">
                                <div class="col-md-4 mb-3">
                                    <label for="totalMarks" class="form-label">Total Marks *</label>
                                    <input type="number" class="form-control" id="totalMarks" th:field="*{totalMarks}" min="1" required>
                                </div>
                                <div class="col-md-4 mb-3">
                                    <label for="passingMarks" class="form-label">Passing Marks *</label>
                                    <input type="number" class="form-control" id="passingMarks" th:field="*{passingMarks}" min="1" required>
                                </div>
                                <div class="col-md-4 mb-3">
                                    <label for="isActive" class="form-label">Status</label>
                                    <select class="form-select" id="isActive" th:field="*{isActive}">
                                        <option value="true">Active</option>
                                        <option value="false">Inactive</option>
                                    </select>
                                </div>
                            </div>

                            <!-- Question Pattern Section -->
                            <div class="card mb-3">
                                <div class="card-header">
                                    <h6><i class="fas fa-cogs"></i> Question Pattern Configuration</h6>
                                </div>
                                <div class="card-body">
                                    <div class="row">
                                        <div class="col-md-4 mb-3">
                                            <label class="form-label">Multiple Choice Questions</label>
                                            <input type="number" class="form-control" name="mcqCount" min="0" value="0" placeholder="Number of MCQs">
                                        </div>
                                        <div class="col-md-4 mb-3">
                                            <label class="form-label">True/False Questions</label>
                                            <input type="number" class="form-control" name="tfCount" min="0" value="0" placeholder="Number of T/F">
                                        </div>
                                        <div class="col-md-4 mb-3">
                                            <label class="form-label">Short Answer Questions</label>
                                            <input type="number" class="form-control" name="saCount" min="0" value="0" placeholder="Number of Short Answer">
                                        </div>
                                    </div>
                                    <div class="row">
                                        <div class="col-md-6 mb-3">
                                            <label class="form-label">Question Randomization</label>
                                            <select class="form-select" name="randomizeQuestions">
                                                <option value="false">Sequential Order</option>
                                                <option value="true">Random Order</option>
                                            </select>
                                        </div>
                                        <div class="col-md-6 mb-3">
                                            <label class="form-label">Navigation Type</label>
                                            <select class="form-select" name="navigationType">
                                                <option value="free">Free Navigation</option>
                                                <option value="sequential">Sequential Only</option>
                                            </select>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="startTime" class="form-label">Start Time *</label>
                                    <input type="datetime-local" class="form-control" id="startTime" th:field="*{startTime}" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="endTime" class="form-label">End Time *</label>
                                    <input type="datetime-local" class="form-control" id="endTime" th:field="*{endTime}" required>
                                </div>
                            </div>

                            <div class="text-center">
                                <button type="submit" class="btn btn-success">
                                    <i class="fas fa-save"></i> Create Exam
                                </button>
                                <a href="/exams" class="btn btn-secondary">
                                    <i class="fas fa-times"></i> Cancel
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var now = new Date();
            var year = now.getFullYear();
            var month = String(now.getMonth() + 1).padStart(2, '0');
            var day = String(now.getDate()).padStart(2, '0');
            var hours = String(now.getHours()).padStart(2, '0');
            var minutes = String(now.getMinutes()).padStart(2, '0');
            
            var currentDateTime = year + '-' + month + '-' + day + 'T' + hours + ':' + minutes;
            
            document.getElementById('startTime').min = currentDateTime;
            document.getElementById('endTime').min = currentDateTime;
            
            document.getElementById('startTime').addEventListener('change', function() {
                document.getElementById('endTime').min = this.value;
            });
        });
    </script>
</body>
</html>
