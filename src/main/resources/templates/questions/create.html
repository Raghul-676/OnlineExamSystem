<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Question - Online Exam System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/dashboard">
                <i class="fas fa-graduation-cap"></i> Online Exam System
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/dashboard">Dashboard</a>
                <a class="nav-link" href="/questions">Questions</a>
                <a class="nav-link" href="/auth/logout">Logout</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row">
            <div class="col-12">
                <div class="card">
                    <div class="card-header">
                        <h4><i class="fas fa-plus-circle"></i> Create New Question</h4>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/questions/create}" method="post" th:object="${question}">
                            <div class="mb-3">
                                <label for="questionText" class="form-label">Question Text *</label>
                                <textarea class="form-control" id="questionText" th:field="*{questionText}" rows="3" required></textarea>
                            </div>

                            <div class="row">
                                <div class="col-md-4 mb-3">
                                    <label for="questionType" class="form-label">Question Type *</label>
                                    <select class="form-select" id="questionType" th:field="*{questionType}" required onchange="toggleOptions()">
                                        <option th:each="type : ${questionTypes}" th:value="${type}" th:text="${type}">Type</option>
                                    </select>
                                </div>
                                <div class="col-md-4 mb-3">
                                    <label for="subject" class="form-label">Subject</label>
                                    <input type="text" class="form-control" id="subject" th:field="*{subject}">
                                </div>
                                <div class="col-md-4 mb-3">
                                    <label for="difficultyLevel" class="form-label">Difficulty Level</label>
                                    <select class="form-select" id="difficultyLevel" th:field="*{difficultyLevel}">
                                        <option th:each="level : ${difficultyLevels}" th:value="${level}" th:text="${level}">Level</option>
                                    </select>
                                </div>
                            </div>

                            <div id="multipleChoiceOptions">
                                <h6>Multiple Choice Options</h6>
                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label for="optionA" class="form-label">Option A</label>
                                        <input type="text" class="form-control" id="optionA" th:field="*{optionA}">
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label for="optionB" class="form-label">Option B</label>
                                        <input type="text" class="form-control" id="optionB" th:field="*{optionB}">
                                    </div>
                                </div>
                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label for="optionC" class="form-label">Option C</label>
                                        <input type="text" class="form-control" id="optionC" th:field="*{optionC}">
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label for="optionD" class="form-label">Option D</label>
                                        <input type="text" class="form-control" id="optionD" th:field="*{optionD}">
                                    </div>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="correctAnswer" class="form-label">Correct Answer *</label>
                                <input type="text" class="form-control" id="correctAnswer" th:field="*{correctAnswer}" required>
                                <div class="form-text">
                                    For Multiple Choice: Enter A, B, C, or D<br>
                                    For True/False: Enter True or False<br>
                                    For Short Answer: Enter the exact answer
                                </div>
                            </div>

                            <div class="text-center">
                                <button type="submit" class="btn btn-success">
                                    <i class="fas fa-save"></i> Create Question
                                </button>
                                <a href="/questions" class="btn btn-secondary">
                                    <i class="fas fa-times"></i> Cancel
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function toggleOptions() {
            var questionType = document.getElementById('questionType').value;
            var optionsDiv = document.getElementById('multipleChoiceOptions');
            
            if (questionType === 'MULTIPLE_CHOICE') {
                optionsDiv.style.display = 'block';
                // Make options required
                document.getElementById('optionA').required = true;
                document.getElementById('optionB').required = true;
                document.getElementById('optionC').required = true;
                document.getElementById('optionD').required = true;
            } else {
                optionsDiv.style.display = 'none';
                // Remove required attribute
                document.getElementById('optionA').required = false;
                document.getElementById('optionB').required = false;
                document.getElementById('optionC').required = false;
                document.getElementById('optionD').required = false;
            }
        }

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', function() {
            toggleOptions();
        });
    </script>
</body>
</html>
