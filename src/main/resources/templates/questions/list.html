<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Questions - Online Exam System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/dashboard">
                <i class="fas fa-graduation-cap"></i> Online Exam System
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/dashboard">Dashboard</a>
                <a class="nav-link" href="/auth/logout">Logout</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row">
            <div class="col-12">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2><i class="fas fa-question-circle"></i> Question Bank</h2>
                    <a href="/questions/create" class="btn btn-primary">
                        <i class="fas fa-plus"></i> Create Question
                    </a>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-12">
                <div class="card">
                    <div class="card-body">
                        <div th:if="${#lists.isEmpty(questions)}" class="text-muted text-center py-5">
                            <i class="fas fa-question-circle fa-3x mb-3"></i>
                            <h5>No Questions Available</h5>
                            <p>Create your first question to build your question bank</p>
                            <a href="/questions/create" class="btn btn-primary">
                                <i class="fas fa-plus"></i> Create Question
                            </a>
                        </div>

                        <div th:unless="${#lists.isEmpty(questions)}">
                            <div th:each="question, iterStat : ${questions}" class="card mb-3">
                                <div class="card-header">
                                    <div class="d-flex justify-content-between align-items-center">
                                        <div>
                                            <h6 class="mb-0">Question #<span th:text="${iterStat.count}">1</span></h6>
                                            <small class="text-muted">
                                                <span class="badge bg-info" th:text="${question.questionType}">Type</span>
                                                <span class="badge bg-secondary" th:text="${question.difficultyLevel}">Level</span>
                                                <span th:if="${question.subject}" class="badge bg-primary" th:text="${question.subject}">Subject</span>
                                            </small>
                                        </div>
                                        <div class="btn-group" role="group">
                                            <a th:href="@{/questions/{id}(id=${question.id})}" class="btn btn-sm btn-outline-primary">
                                                <i class="fas fa-eye"></i> View
                                            </a>
                                            <a th:href="@{/questions/{id}/edit(id=${question.id})}" class="btn btn-sm btn-outline-warning">
                                                <i class="fas fa-edit"></i> Edit
                                            </a>
                                            <form th:action="@{/questions/{id}/delete(id=${question.id})}" method="post" style="display: inline;">
                                                <button type="submit" class="btn btn-sm btn-outline-danger" 
                                                        onclick="return confirm('Are you sure you want to delete this question?')">
                                                    <i class="fas fa-trash"></i> Delete
                                                </button>
                                            </form>
                                        </div>
                                    </div>
                                </div>
                                <div class="card-body">
                                    <p class="card-text" th:text="${question.questionText}">Question text</p>
                                    
                                    <div th:if="${question.questionType.name() == 'MULTIPLE_CHOICE'}" class="mt-3">
                                        <div class="row">
                                            <div class="col-md-6">
                                                <small class="text-muted">A) <span th:text="${question.optionA}">Option A</span></small><br>
                                                <small class="text-muted">B) <span th:text="${question.optionB}">Option B</span></small>
                                            </div>
                                            <div class="col-md-6">
                                                <small class="text-muted">C) <span th:text="${question.optionC}">Option C</span></small><br>
                                                <small class="text-muted">D) <span th:text="${question.optionD}">Option D</span></small>
                                            </div>
                                        </div>
                                    </div>
                                    
                                    <div class="mt-2">
                                        <small class="text-success">
                                            <i class="fas fa-check-circle"></i> 
                                            Correct Answer: <strong th:text="${question.correctAnswer}">Answer</strong>
                                        </small>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
